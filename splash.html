<!doctype html><meta charset="utf-8"><style>
*{margin:0;box-sizing:border-box}html,body{height:100%;background:transparent;font-family:'Segoe UI',sans-serif;color:#fff;overflow:hidden}
.box{height:100%;border-radius:36px;background:radial-gradient(circle at 30% 20%,#2a1b55,#0a0714 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;-webkit-app-region:drag;animation:in .7s cubic-bezier(.2,.9,.3,1.2)}
@keyframes in{from{opacity:0;transform:scale(.8)}}
img{width:130px;height:130px;border-radius:32px;animation:float 3s ease-in-out infinite;filter:drop-shadow(0 0 28px #8a63ff)}
@keyframes float{50%{transform:translateY(-8px)}}
h1{font-size:20px;letter-spacing:6px;font-weight:700}
.bar{width:240px;height:5px;border-radius:9px;background:#ffffff1a;overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:9px;background:linear-gradient(90deg,#c4a1ff,#4fd8e8);animation:ld 3.3s ease-out forwards}
@keyframes ld{to{width:100%}}small{opacity:.55;font-size:12px}
</style><div class="box"><img src="./logo.svg"><h1>IWOHO CLIENT</h1><div class="bar"><i></i></div><small id="t">Загрузка файлов…</small></div>
<script>const m=['Загрузка файлов…','Проверка ресурсов…','Подготовка лаунчера…'];let i=0;setInterval(()=>document.getElementById('t').textContent=m[++i%3],1100)</script>
