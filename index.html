<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>Iwoho Launcher</title><style>
:root{--c1:#8a63ff;--c2:#4fd8e8;--bg:#0a0714;--glass:rgba(255,255,255,.06);--line:rgba(255,255,255,.12)}
*{margin:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,sans-serif}
body{height:100vh;background:var(--bg);color:#fff;overflow:hidden;user-select:none}
#bgGrad{position:fixed;inset:-30%;background:conic-gradient(from 0deg,var(--c1),var(--bg),var(--c2),var(--bg),var(--c1));filter:blur(90px);opacity:.55;animation:spin 28s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#bgMedia{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .8s}
#bgMedia.on{opacity:.55}
#shade{position:fixed;inset:0;background:radial-gradient(circle at 50% 40%,transparent,#000a 90%)}
.top{position:fixed;top:0;left:0;right:0;height:42px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;-webkit-app-region:drag;z-index:20}
.brand{display:flex;gap:10px;align-items:center;font-weight:700;letter-spacing:2px;font-size:13px}.brand img{width:22px;border-radius:6px}
.wc{display:flex;gap:8px;-webkit-app-region:no-drag}.wc button{width:30px;height:26px;border:0;border-radius:8px;background:var(--glass);color:#fff;cursor:pointer;transition:.2s}.wc button:hover{background:var(--c1)}
.app{position:fixed;inset:54px 14px 14px;display:flex;gap:14px;animation:rise .8s cubic-bezier(.2,.9,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(24px) scale(.98)}}
.side{width:210px;border-radius:26px;padding:12px;background:linear-gradient(180deg,color-mix(in srgb,var(--c1) 55%,transparent),color-mix(in srgb,var(--bg) 70%,transparent));border:1px solid var(--line);backdrop-filter:blur(20px);display:flex;flex-direction:column;gap:8px}
.nav{padding:13px 16px;border-radius:16px;cursor:pointer;font-weight:600;color:#ffffffb0;transition:.25s;display:flex;gap:12px}
.nav:hover{background:var(--glass);transform:translateX(4px)}.nav.on{color:#fff;background:linear-gradient(90deg,var(--c1),var(--c2));box-shadow:0 8px 30px -8px var(--c1)}
.main{flex:1;border-radius:26px;position:relative;overflow:hidden;background:linear-gradient(135deg,#0008,#0003);border:1px solid var(--line);backdrop-filter:blur(8px)}
.page{position:absolute;inset:0;padding:34px;opacity:0;pointer-events:none;transform:translateY(14px);transition:.45s}.page.on{opacity:1;pointer-events:auto;transform:none}
.hero h1{font-size:76px;font-weight:900;letter-spacing:-1px;margin-top:130px;background:linear-gradient(90deg,#fff,color-mix(in srgb,var(--c2) 50%,#fff));-webkit-background-clip:text;color:transparent}
.hero p{font-size:19px;opacity:.8;margin-top:6px}.hero small{display:block;margin-top:14px;opacity:.5}
.dock{position:absolute;left:24px;right:24px;bottom:24px;display:flex;gap:14px;padding:16px;border-radius:24px;background:#0007;border:1px solid var(--line);backdrop-filter:blur(18px)}
.f{display:flex;flex-direction:column;gap:6px;flex:1;font-size:11px;letter-spacing:1.5px;opacity:.9}.f span{opacity:.6;font-weight:700}
input,select{height:46px;border-radius:14px;border:1px solid var(--line);background:#000a;color:#fff;padding:0 14px;font-size:15px;font-weight:600;outline:none;transition:.2s}input:focus,select:focus{border-color:var(--c1);box-shadow:0 0 0 3px color-mix(in srgb,var(--c1) 35%,transparent)}
.play{flex:1.1;border:0;border-radius:16px;font-size:18px;font-weight:900;letter-spacing:2px;color:#fff;cursor:pointer;align-self:flex-end;height:46px;background:linear-gradient(90deg,var(--c2),var(--c1),var(--c2));background-size:200%;animation:flow 4s linear infinite;transition:.2s}
.play:hover{transform:translateY(-2px) scale(1.02);box-shadow:0 10px 36px -6px var(--c1)}@keyframes flow{to{background-position:200%}}
h2{font-size:26px;margin-bottom:20px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
.card{height:96px;border-radius:20px;cursor:pointer;border:2px solid transparent;display:flex;align-items:flex-end;padding:12px;font-weight:700;transition:.25s}.card:hover{transform:translateY(-4px) scale(1.03)}.card.on{border-color:#fff;box-shadow:0 0 28px -4px var(--c1)}
.row{display:flex;gap:14px;align-items:center;margin:18px 0}.row label{opacity:.7;width:150px}input[type=color]{width:60px;padding:3px}
.btn{height:44px;padding:0 20px;border-radius:14px;border:1px solid var(--line);background:var(--glass);color:#fff;font-weight:600;cursor:pointer;transition:.2s}.btn:hover{background:var(--c1)}
/* fullscreen play screen */
#fs{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:.6s;background:#000}
#fs.on{opacity:1;pointer-events:auto}#fsBg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.75}
#fsGrad{position:absolute;inset:-30%;background:conic-gradient(from 0deg,var(--c1),#000,var(--c2),#000,var(--c1));filter:blur(80px);opacity:.5;animation:spin 24s linear infinite}
.menu{position:relative;width:340px;padding:22px;border-radius:34px;background:#0009;border:1px solid var(--line);backdrop-filter:blur(26px);box-shadow:0 30px 90px -20px var(--c1);transform:scale(.9);transition:.6s cubic-bezier(.2,.9,.3,1.2)}#fs.on .menu{transform:none}
.menu header{display:flex;gap:12px;align-items:center;margin-bottom:18px}.menu header img{width:44px;border-radius:12px}.menu header b{display:block}.menu header small{opacity:.5}
.mb{width:100%;height:50px;margin-bottom:10px;border-radius:15px;border:1px solid var(--line);background:var(--glass);color:#fff;font-size:15px;font-weight:600;cursor:pointer;transition:.25s;text-align:left;padding:0 18px}.mb:hover{background:linear-gradient(90deg,var(--c1),var(--c2));transform:translateX(5px)}
.sv{display:none;gap:8px;margin-bottom:10px}.sv.on{display:flex}.sv input{flex:1}
.status{margin-top:8px;font-size:12px;opacity:.8;min-height:34px}.pb{height:5px;border-radius:9px;background:#fff2;margin-top:6px;overflow:hidden}.pb i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--c1),var(--c2));transition:width .3s}
.ver{position:absolute;left:14px;bottom:10px;font-size:12px;opacity:.5}.ver.r{left:auto;right:14px}
</style></head><body>
<div id="bgGrad"></div><video id="bgMedia" autoplay loop muted playsinline></video><div id="shade"></div>
<div class="top"><div class="brand"><img src="./logo.svg">IWOHO LAUNCHER</div><div class="wc"><button onclick="api.win('min')">—</button><button onclick="api.win('max')">▢</button><button onclick="api.win('close')">✕</button></div></div>

<div class="app">
 <div class="side">
  <div class="nav on" data-p="play">▶ Играть</div><div class="nav" data-p="mods">☰ Моды</div><div class="nav" data-p="set">⚙ Настройки</div>
  <div style="flex:1"></div><div style="padding:10px;font-size:12px;opacity:.5">Iwoho Visuals<br>v1.0.0</div>
 </div>
 <div class="main">
  <div class="page on" id="play"><div class="hero"><h1>IWOHO CLIENT</h1><p>Играй плавно. Играй красиво.</p><small>Iwoho Visuals</small></div>
   <div class="dock">
    <div class="f"><span>НИК</span><input id="nick" value="Player" maxlength="16"></div>
    <div class="f"><span>ВЕРСИЯ</span><select id="ver"><option>1.20.1</option><option>1.20.4</option><option>1.21.1</option><option>1.19.4</option><option>1.16.5</option><option>1.12.2</option><option>1.8.9</option></select></div>
    <div class="f"><span>ЗАГРУЗЧИК</span><select id="loader"><option>Fabric</option><option>Vanilla</option></select></div>
    <button class="play" id="playBtn">ИГРАТЬ</button>
   </div></div>
  <div class="page" id="mods"><h2>Моды</h2><p style="opacity:.6">Положи .jar в папку модов (%appdata%\.iwoho\mods).</p><div class="row"><button class="btn" id="openMods">Открыть папку</button></div></div>
  <div class="page" id="set"><h2>Настройки</h2>
   <h3 style="opacity:.7;margin-bottom:12px">Темы</h3><div class="grid" id="themes"></div>
   <div class="row"><label>Свой градиент</label><input type="color" id="c1"><input type="color" id="c2"><button class="btn" id="rand">🎲 Случайный</button></div>
   <h3 style="opacity:.7;margin:20px 0 12px">Фон</h3><div class="grid" id="bgs"></div>
   <div class="row"><label>Оперативная память</label><select id="ram"><option>2G</option><option selected>4G</option><option>6G</option><option>8G</option></select></div>
  </div>
 </div>
</div>

<div id="fs"><div id="fsGrad"></div><video id="fsBg" autoplay loop muted playsinline></video>
 <div class="menu"><header><img src="./logo.svg"><div><b>Iwoho Visuals</b><small id="fsVer"></small></div></header>
  <button class="mb" id="single">🎮 Одиночная игра</button>
  <button class="mb" id="multi">🌐 Сетевая игра</button>
  <div class="sv" id="sv"><input id="srv" placeholder="адрес сервера, напр. funtime.su"><button class="btn" id="go">▶</button></div>
  <button class="mb" id="back">← Назад</button>
  <div class="status" id="st"></div><div class="pb"><i id="pb"></i></div>
 </div>
 <div class="ver">Iwoho Visuals 1.0</div><div class="ver r">Minecraft Java Edition</div>
</div>

<script>
const $=s=>document.querySelector(s),root=document.documentElement;
const THEMES=[['Фиолет','#8a63ff','#4fd8e8'],['Красный','#ff2d3d','#ff9a3d'],['Закат','#ff7b3d','#ffd24f'],['Океан','#2d7bff','#2dffd0'],['Сакура','#ff5fa8','#c46bff'],['Токсик','#6bff3d','#2dd4ff']];
const BGS=[['Градиент',''],['Видео 1','./video1.mp4'],['Видео 2','./video2.mp4'],['Свой файл…','pick']];
let S=JSON.parse(localStorage.getItem('iwoho')||'{}');S={c1:'#8a63ff',c2:'#4fd8e8',bg:'',...S};
const save=()=>localStorage.setItem('iwoho',JSON.stringify(S));
function paint(){root.style.setProperty('--c1',S.c1);root.style.setProperty('--c2',S.c2);$('#c1').value=S.c1;$('#c2').value=S.c2;}
function media(){for(const v of [$('#bgMedia'),$('#fsBg')]){if(S.bg){v.src=S.bg;v.play();v.classList.add('on')}else{v.removeAttribute('src');v.classList.remove('on')}}}
$('#themes').innerHTML=THEMES.map(([n,a,b],i)=>`<div class="card" data-i="${i}" style="background:linear-gradient(135deg,${a},${b})">${n}</div>`).join('');
$('#bgs').innerHTML=BGS.map(([n,p],i)=>`<div class="card" data-b="${i}" style="background:#ffffff14">${n}</div>`).join('');
$('#themes').onclick=e=>{const c=e.target.closest('.card');if(!c)return;const t=THEMES[c.dataset.i];S.c1=t[1];S.c2=t[2];paint();save()};
$('#bgs').onclick=async e=>{const c=e.target.closest('.card');if(!c)return;let p=BGS[c.dataset.b][1];if(p==='pick'){const f=await api.pickFile();if(!f)return;p='file:///'+f.replace(/\\/g,'/')}S.bg=p;media();save()};
$('#c1').oninput=e=>{S.c1=e.target.value;paint();save()};$('#c2').oninput=e=>{S.c2=e.target.value;paint();save()};
$('#rand').onclick=()=>{const r=()=>'#'+Math.floor(Math.random()*0xffffff).toString(16).padStart(6,'0');S.c1=r();S.c2=r();paint();save()};
document.querySelectorAll('.nav').forEach(n=>n.onclick=()=>{document.querySelectorAll('.nav,.page').forEach(x=>x.classList.remove('on'));n.classList.add('on');$('#'+n.dataset.p).classList.add('on')});
// play flow
$('#openMods').onclick=()=>api.openMods();
$('#playBtn').onclick=()=>{$('#fsVer').textContent=`${$('#ver').value} · ${$('#loader').value}`;api.fullscreen(true);$('#fs').classList.add('on')};
$('#back').onclick=()=>{$('#fs').classList.remove('on');api.fullscreen(false)};
$('#multi').onclick=()=>$('#sv').classList.toggle('on');
async function run(server){
  $('#st').textContent='Подготовка…';$('#pb').style.width='0';
  const r=await api.launch({nick:$('#nick').value,version:$('#ver').value,loader:$('#loader').value,ram:$('#ram').value,server});
  if(!r.ok)$('#st').textContent='Ошибка: '+r.error;
}
$('#single').onclick=()=>run();$('#go').onclick=()=>run($('#srv').value.trim());
api.on('progress',d=>{$('#st').textContent=d.text;$('#pb').style.width=d.pct+'%'});
api.on('started',()=>{$('#st').textContent='Игра запущена ✔';$('#pb').style.width='100%'});
api.on('closed',()=>{$('#st').textContent='Игра закрыта'});
const sv=localStorage.getItem('iwohoNick');if(sv)$('#nick').value=sv;$('#nick').onchange=e=>localStorage.setItem('iwohoNick',e.target.value);
paint();media();
</script></body></html>
